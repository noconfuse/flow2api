services:
  flow2api-headed:
    init: true
    build:
      context: .
      dockerfile: Dockerfile.headed
    image: flow2api:headed
    container_name: flow2api-headed
    ports:
      - "8000:8000"
    volumes:
      - flow2api_headed_data:/app/data
      - ./data/backups:/app/data/backups
      - ./browser_data:/app/browser_data
      - ./tmp:/app/tmp
      - ./.dbg:/app/.dbg
      - ./config/setting.toml:/app/config/setting.toml
      - ./src:/app/src
      - ./static:/app/static
      - ./extension:/app/extension
    environment:
      - PYTHONUNBUFFERED=1
      - ALLOW_DOCKER_HEADED_CAPTCHA=true
      - DISPLAY=:99
      - XVFB_SCREEN=1440x900x24
      - FLOW2API_BROWSER_LAUNCH_MODE=host_bridge
      - FLOW2API_BROWSER_LAUNCH_HOST_URL=http://host.docker.internal:8765/launch
    extra_hosts:
      - "host.docker.internal:host-gateway"
    shm_size: "2gb"
    restart: unless-stopped

volumes:
  flow2api_headed_data:
    name: flow2api_headed_data
